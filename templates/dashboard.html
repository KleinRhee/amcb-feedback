{% extends 'base.html' %}
{% block content %}
<div class="w-full max-w-md glass-panel rounded-3xl overflow-hidden border border-gray-200/60 dark:border-gray-700/60 shadow-2xl relative">
    
    <div class="px-6 py-5 bg-gray-50/50 dark:bg-slate-800/40 border-b border-gray-200/50 dark:border-gray-700/50 flex justify-between items-center backdrop-blur-sm">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-amcprimary/10 dark:bg-amcprimary/30 text-amcprimary dark:text-amcteal flex items-center justify-center shadow-inner">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <div>
                <p class="text-xs text-gray-500 dark:text-gray-400 font-bold uppercase tracking-wider">Logged in</p>
                <p class="text-sm font-black text-gray-900 dark:text-white">{{ username }}</p>
            </div>
        </div>
        <a href="/logout" class="text-sm font-bold text-red-500 bg-red-50 dark:bg-red-900/20 px-4 py-2 rounded-full hover:bg-red-100 dark:hover:bg-red-900/40 transition-colors btn-premium">Logout</a>
    </div>

    <div class="p-8 space-y-4">
        <div class="mb-6 flex justify-between items-end">
            <h2 class="text-3xl font-black text-gray-900 dark:text-white tracking-tight">Dashboard</h2>
            <button onclick="document.getElementById('pwModal').classList.remove('hidden')" class="text-xs font-bold text-amcprimary dark:text-amcteal hover:underline">Change Password</button>
        </div>

        <a href="/form/out-patient" class="flex items-center bg-gray-900 dark:bg-white text-white dark:text-gray-900 p-5 rounded-2xl font-bold btn-premium shadow-lg group">
            <div class="bg-white/20 dark:bg-black/10 p-3 rounded-xl mr-4 group-active:scale-95 transition-transform">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
            </div>
            <span class="text-lg flex-grow">Out-Patient</span>
        </a>

        <a href="/form/in-patient" class="flex items-center bg-amcprimary text-white p-5 rounded-2xl font-bold btn-premium shadow-lg group">
            <div class="bg-white/20 p-3 rounded-xl mr-4 group-active:scale-95 transition-transform">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            </div>
            <span class="text-lg flex-grow">In-Patient</span>
        </a>
        
        <div class="pt-6 mt-6 border-t border-gray-200/60 dark:border-gray-700/60 grid grid-cols-2 gap-3">
            <a href="/admin" class="flex flex-col items-center justify-center bg-gray-100 dark:bg-slate-800 p-4 rounded-2xl font-bold text-gray-700 dark:text-gray-300 btn-premium border border-gray-200 dark:border-gray-700">
                <svg class="w-6 h-6 mb-2 text-amcorange" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                <span class="text-xs uppercase tracking-wider">Analytics</span>
            </a>

            {% if username == 'it_super' %}
            <a href="/settings" class="flex flex-col items-center justify-center bg-gray-100 dark:bg-slate-800 p-4 rounded-2xl font-bold text-gray-700 dark:text-gray-300 btn-premium border border-gray-200 dark:border-gray-700">
                <svg class="w-6 h-6 mb-2 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span class="text-xs uppercase tracking-wider">System Config</span>
            </a>
            {% else %}
            <div class="flex flex-col items-center justify-center bg-gray-50/50 dark:bg-slate-800/30 p-4 rounded-2xl border border-dashed border-gray-200 dark:border-gray-700 opacity-50">
                <svg class="w-6 h-6 mb-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                <span class="text-xs uppercase tracking-wider text-gray-400">Restricted</span>
            </div>
            {% endif %}
        </div>
    </div>
</div>

<!-- Change Password Modal -->
<div id="pwModal" class="fixed inset-0 z-[200] hidden flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="document.getElementById('pwModal').classList.add('hidden')"></div>
    <div class="bg-white dark:bg-darkcard rounded-3xl p-8 max-w-sm w-full relative z-10 shadow-2xl border border-gray-200 dark:border-gray-700 animate-slide-down">
        <h3 class="text-2xl font-black text-center text-gray-900 dark:text-white mb-6">Change Password</h3>
        <form method="POST" action="/change_password" class="space-y-4">
            <input type="password" name="current_password" placeholder="Current Password" required class="w-full p-4 bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-amcprimary outline-none font-medium text-gray-900 dark:text-white">
            <input type="password" name="new_password" placeholder="New Password" required class="w-full p-4 bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-amcprimary outline-none font-medium text-gray-900 dark:text-white">
            <button type="submit" class="w-full bg-amcprimary text-white font-bold py-3.5 rounded-xl btn-premium mt-2">Update Password</button>
        </form>
    </div>
</div>
{% endblock %}
