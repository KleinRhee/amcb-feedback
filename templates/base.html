<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMC-B Feedback</title>
    
    <link rel="icon" href="{{ url_for('static', filename='logo.png') }}" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- PERFECTED: We replaced the slow CDN with our blazing-fast, compiled local CSS! -->
    <link rel="stylesheet" href="{{ url_for('static', filename='output.css') }}">
    
    <!-- Keep the Dark Mode pre-loader so the screen doesn't flash white on reload -->
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-darkbg text-gray-900 dark:text-gray-100 min-h-screen flex flex-col relative overflow-x-hidden bg-grid">
    
    <div id="toast-container" class="fixed top-4 left-0 right-0 z-[100] flex flex-col items-center pointer-events-none space-y-2">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="animate-slide-down pointer-events-auto px-6 py-3 rounded-full font-bold shadow-2xl backdrop-blur-md border flex items-center gap-2
                        {% if category == 'error' %} bg-red-100/90 text-red-700 border-red-200 dark:bg-red-900/90 dark:text-red-100 dark:border-red-800 
                        {% else %} bg-green-100/90 text-green-700 border-green-200 dark:bg-green-900/90 dark:text-green-100 dark:border-green-800 {% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <!-- Background Glows -->
    <div class="fixed inset-0 overflow-hidden -z-10 pointer-events-none opacity-60">
        <div class="absolute top-[-10%] right-[-5%] w-[40rem] h-[40rem] bg-gradient-to-br from-amcteal/20 to-transparent rounded-full blur-3xl"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-[40rem] h-[40rem] bg-gradient-to-tr from-amcprimary/20 to-transparent rounded-full blur-3xl"></div>
    </div>

    <!-- Theme Toggle -->
    <button id="theme-toggle" class="fixed bottom-6 right-6 z-50 glass-panel rounded-full p-4 btn-premium text-gray-600 dark:text-gray-300">
        <svg id="theme-toggle-dark-icon" class="hidden w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"></path></svg>
        <svg id="theme-toggle-light-icon" class="hidden w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path>
        </svg>
    </button>

    <main class="flex-grow flex flex-col justify-center items-center p-4 z-10 w-full animate-slide-down">
        {% block content %}{% endblock %}
    </main>

    <script>
        setTimeout(() => { const c = document.getElementById('toast-container'); if(c) { c.style.opacity = '0'; c.style.transition = 'opacity 0.5s ease'; } }, 4000);
        var dIcon = document.getElementById('theme-toggle-dark-icon'), lIcon = document.getElementById('theme-toggle-light-icon');
        if (document.documentElement.classList.contains('dark')) { lIcon.classList.remove('hidden'); } else { dIcon.classList.remove('hidden'); }
        document.getElementById('theme-toggle').addEventListener('click', function() {
            dIcon.classList.toggle('hidden'); lIcon.classList.toggle('hidden');
            if (document.documentElement.classList.contains('dark')) { document.documentElement.classList.remove('dark'); localStorage.setItem('color-theme', 'light'); } 
            else { document.documentElement.classList.add('dark'); localStorage.setItem('color-theme', 'dark'); }
        });
    </script>
</body>
</html>
