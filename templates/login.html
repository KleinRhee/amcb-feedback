{% extends 'base.html' %}
{% block content %}
<div class="w-full max-w-md bg-white/80 dark:bg-darkcard/80 backdrop-blur-xl border border-white/40 dark:border-gray-700/50 rounded-3xl shadow-2xl p-8 transition-colors">
    <div class="text-center mb-8">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="AMC-B Logo" class="h-28 mx-auto mb-4 object-contain filter drop-shadow-md">
        <h1 class="text-2xl font-extrabold text-amcprimary dark:text-amcteal">IT Staff Portal</h1>
        <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">Secure Feedback Administration</p>
    </div>
    {% with messages = get_flashed_messages(category_filter=["error"]) %}
      {% if messages %}
        <div class="bg-red-100/80 backdrop-blur-sm text-red-700 p-3 rounded-xl mb-4 text-sm text-center border border-red-200">
          {{ messages[0] }}
        </div>
      {% endif %}
    {% endwith %}
    <form method="POST" action="/login" class="space-y-5">
        <div>
            <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Username</label>
            <input type="text" name="username" required class="w-full p-3.5 bg-white/70 dark:bg-gray-900/70 border border-gray-200 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-amcprimary outline-none transition-all shadow-inner text-gray-900 dark:text-white">
        </div>
        <div>
            <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Password</label>
            <input type="password" name="password" required class="w-full p-3.5 bg-white/70 dark:bg-gray-900/70 border border-gray-200 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-amcprimary outline-none transition-all shadow-inner text-gray-900 dark:text-white">
        </div>
        <button type="submit" class="w-full bg-amcprimary text-white p-4 rounded-xl font-bold hover:shadow-lg hover:shadow-amcprimary/40 active:scale-95 transition-all mt-4">
            Authenticate
        </button>
    </form>
</div>
{% endblock %}
